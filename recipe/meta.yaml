{% set version = "1.1.6" %}
{% set xorg_name = "libXinerama" %}
{% set name = "xorg-" ~ xorg_name %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ xorg_name }}-{{ version }}.tar.xz
  sha256: d00fc1599c303dc5cbc122b8068bdc7405d6fcb19060f4597fc51bd3a8be51d7

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11 aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage('xorg-libxinerama', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c')}}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - pkg-config
    - make
    - autoconf
    - automake
    - libtool
    - xorg-util-macros
  host:
    - xorg-util-macros
    - xorg-libx11
    - xorg-libxext
    - xorg-xorgproto

test:
  commands:
    {% set lib_idents = [ "Xinerama" ] %}
    {% for lib_ident in lib_idents %}
    - test -f $PREFIX/lib/lib{{ lib_ident }}${SHLIB_EXT}           # [unix]
    - if not exist %LIBRARY_LIB%/lib{{ lib_ident }}.a exit /b 1    # [win]
    {% endfor %}

about:
  home: https://gitlab.freedesktop.org/xorg/lib/libxinerama
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxinerama
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxinerama
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Client library for the Xinerama extension to the X11 protocol.

extra:
  recipe-maintainers:
    - hmaarrfk
